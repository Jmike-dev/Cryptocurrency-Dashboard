# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - prod
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
            # Use stable Node.js v20
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Install dependencies and ensure package-lock.json is updated
      - name: Install dependencies and update package-lock.json

        run: |
          npm install
          git diff --quiet || git add package-lock.json
      - run: npm ci && npm run build
        env:
          VITE_COINGECKO: ${{ vars.VITE_COINGECKO }}
          VITE_APIKEY: ${{vars.VITE_APIKEY}}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CRYTO_CURRENCY_DASHBOARD }}
          channelId: live
          projectId: cryto-currency-dashboard
